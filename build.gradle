plugins {
    id 'base'
}

subprojects {
    version = rootProject.version
    group = rootProject.group
    plugins.withId('java') {
        tasks.withType(Jar).configureEach {
            archiveFileName.set(provider {
                def classifier = archiveClassifier.getOrElse('')
                def loader = project.name == 'neoforge' ? 'neiforge' : project.name
                "offhand-fix-mc${project.minecraft_version}-${loader}-${project.version}${classifier ? '-' + classifier : ''}.jar"
            })
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build all Minecraft 26.2 loader artifacts.'
    dependsOn ':fabric:build', ':forge:build', ':neoforge:build'
}

tasks.named('build') { dependsOn 'buildAll' }
tasks.named('clean') { dependsOn ':fabric:clean', ':forge:clean', ':neoforge:clean' }
