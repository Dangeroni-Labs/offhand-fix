buildscript {
    // The legacy plugin's Artifactural 3.0.17 uses Gradle internals removed in 8.11.
    // Use the compatible implementation already required by ForgeGradle 6.
    configurations.classpath {
        resolutionStrategy.dependencySubstitution {
            substitute module('net.neoforged:artifactural') using module('net.minecraftforge:artifactural:3.0.21')
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle' version '[6.0.13, 6.2)'
    id 'idea'
}


group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = "offhand-fix"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory = layout.projectDirectory.dir('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            args "--mixin.config=${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.neoforged:forge:${neo_version}"
    implementation 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_repository_url     : mod_repository_url,
            mod_issues_url         : mod_issues_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn 'createMcpToSrg'
    options.compilerArgs += [
        "-AoutRefMapFile=${buildDir}/classes/java/main/${mod_id}.refmap.json",
        "-AreobfTsrgFile=${buildDir}/createMcpToSrg/output.tsrg",
        '-AmappingTypes=tsrg',
        '-AdefaultObfuscationEnv=searge'
    ]
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes['MixinConfigs'] = "${mod_id}.mixins.json"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Shared calculation and assets compile/package within each loader.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Forge and NeoForge 1.20.1 both use official mappings.
sourceSets.main.java.srcDir rootProject.file('common/src/official/java')

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_offhand-fix' } }
    finalizedBy 'reobfJar'
}
